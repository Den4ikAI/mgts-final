[package]
name = "api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum = { workspace = true, features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
calamine = "0.38.0"
chrono.workspace = true
cookie = "0.18"
domain.workspace = true
encoding_rs = "0.8.44"
futures.workspace = true
jsonwebtoken = "9"
rand = "0.8"
rdkafka.workspace = true
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
rust_xlsxwriter = "0.104.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
tempfile = "3.27.0"
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { version = "6.0.0", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid.workspace = true
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
