# Local stack: Kafka (Redpanda, Kafka API compatible), Kafka UI, Postgres, S3 (SeaweedFS), API.
#   docker compose up -d redpanda console postgres s3 topics   # infra only, run api/web locally
#   docker compose up -d --build                     # everything
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 20

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on: { redpanda: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk -X brokers=redpanda:9092 topic create frames.ingested frames.analyzed detections.created -p 3 || true
        rpk -X brokers=redpanda:9092 topic create object.events -p 6 -c retention.ms=-1 || true
    restart: "no"

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8081:8080"]
    depends_on: [redpanda]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mgts
      POSTGRES_PASSWORD: mgts
      POSTGRES_DB: mgts
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mgts"]
      interval: 3s
      retries: 20

  # S3-compatible object storage for uploaded photos (SeaweedFS; any S3 works in prod).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=512
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://mgts:mgts@postgres:5432/mgts
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: info,api=debug
      # Auth. Empty JWT_SECRET = random per start (sessions die on restart).
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TTL_SECS: ${ACCESS_TTL_SECS:-900}
      REFRESH_TTL_SECS: ${REFRESH_TTL_SECS:-2592000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-1}
      # Dataset photos (/api/media), ML reports (/api/quality), class labels (/api/taxonomy).
      MEDIA_ROOT: /data
      RUNS_DIR: /runs
      TAXONOMY_PATH: /taxonomy.json
      # Uploaded photos (POST /api/frames). Empty S3_ENDPOINT = local folder UPLOAD_DIR.
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: mgts-frames
      S3_ACCESS_KEY: mgts
      S3_SECRET_KEY: mgts-secret
    volumes:
      - ${DATASET_DIR:-./data}:/data:ro
      - ./ml/runs:/runs:ro
      - ./ml/taxonomy.json:/taxonomy.json:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      topics: { condition: service_completed_successfully }
      s3: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
